# Конфигурация Джарвиса. Скопируйте в config.yaml и правьте под себя.
log_level: INFO
greeting: "Все системы в норме, сэр."

wake_word:
  enabled: true
  model: hey_jarvis        # предобученная модель openWakeWord
  threshold: 0.5
  fallback_phrases: ["джарвис", "jarvis"]

stt:
  model: small             # tiny | base | small | medium | large-v3
  language: ru
  device: auto             # auto | cpu | cuda
  compute_type: int8       # int8 для CPU, float16 для GPU
  beam_size: 1

tts:
  engine: sapi5            # sapi5 (офлайн, Windows) | edge (neural, нужен интернет)
  voice: ""                # часть имени голоса SAPI, например "Irina"
  edge_voice: ru-RU-DmitryNeural
  rate: 190
  volume: 1.0

mic:
  device: null             # индекс устройства из `python -m jarvis devices`
  sample_rate: 16000
  frame_ms: 30
  vad_aggressiveness: 2
  silence_ms: 800
  max_utterance_s: 15.0
  preroll_ms: 300

brain:
  backend: ollama          # ollama | openai | offline
  openai_model: gpt-4o-mini
  openai_base_url: ""      # для совместимых API (OpenRouter и т.п.)
  ollama_model: qwen2.5:7b-instruct
  ollama_host: http://127.0.0.1:11434
  temperature: 0.4
  max_history: 20
  max_tool_iterations: 5

ui:
  enabled: true
  opacity: 0.85
  accent: "#3fd0ff"
  corner: bottom-right     # top-left | top-right | bottom-left | bottom-right
  width: 380
  height: 220

monitor:                   # Джарвис сам предупреждает о проблемах с ПК
  enabled: true
  interval_s: 60
  repeat_after_s: 900     # не повторять одно предупреждение чаще, чем раз в 15 минут
  battery_low: 20
  battery_critical: 10
  memory_high: 90
  disk_high: 92
  cpu_high: 95
  cpu_samples: 3          # столько замеров подряд, чтобы не реагировать на всплеск

skills:
  allow_shutdown: false    # true разрешает голосовое выключение ПК
  search_engine: "https://duckduckgo.com/?q={query}"
  apps:                    # свои приложения: "фраза": "путь или команда"
    музыка: "C:\\Users\\Public\\Desktop\\Spotify.lnk"
    работа: "C:\\Program Files\\Microsoft VS Code\\Code.exe"

  vision:                  # «зрение»: анализ экрана и OCR
    enabled: true
    backend: auto          # auto (как brain.backend) | ollama | openai
    ollama_model: llava:7b # ollama pull llava:7b
    openai_model: gpt-4o-mini
    ocr_languages: rus+eng
    tesseract_cmd: ""      # напр. C:\\Program Files\\Tesseract-OCR\\tesseract.exe
    max_side_px: 1600

  memory:                  # долговременная память (запомни / вспомни)
    enabled: true
    backend: auto          # auto | chroma | json
    top_k: 3

  browser:                 # автоматизация браузера через Playwright
    enabled: true
    engine: chromium       # chromium | firefox | webkit
    headless: false
    timeout_ms: 15000
    max_text_chars: 2000

  spotify:                 # включить конкретный трек по названию
    enabled: false         # true + SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET в окружении
    redirect_uri: "http://127.0.0.1:8888/callback"
    launch_app: true

  weather:                 # погода (wttr.in бесплатно, OWM точнее)
    enabled: true
    default_city: "Новосибирск"
    api_key: ""           # OpenWeatherMap ключ (необязательно, без него — wttr.in)

  calendar:                # локальный календарь через ICS файлы
    enabled: true
    ics_dir: "~/.jarvis/calendar"

  files:                   # файловый менеджер
    enabled: true
    home_dir: "~"         # базовая директория для операций

  youtube:                 # YouTube Music (yt-dlp + MPV)
    enabled: true
    audio_only: true        # только аудио, без видео
    volume: 100

  face:                    # распознавание лиц (OpenCV, отключено по умолчанию)
    enabled: false
    camera_index: 0
    photo_dir: "~/Pictures/Jarvis"

  github:                  # GitHub API (коммиты, issues, PR)
    enabled: true
    token: ""             # GITHUB_TOKEN или Personal Access Token
    default_repo: ""       # owner/repo по умолчанию

  vpn:                     # WireGuard / OpenVPN (отключено по умолчанию)
    enabled: false
    backend: auto          # auto | wireguard | openvpn
    default_config: ""

  sounds:                  # звуковые эффекты (отключено по умолчанию)
    enabled: false
    sounds_dir: "~/.jarvis/sounds"

  pomodoro:                # помодоро-таймер (25/5/15)
    enabled: true
    work_min: 25
    break_min: 5
    long_break_min: 15

  news:                    # RSS ленты новостей (Habr, HN, Лента)
    enabled: true
    # feeds:
    #   - name: "Habr"
    #     url: "https://habr.com/ru/rss/best/daily/"

  currency:                # конвертер валют (exchangerate-api.com)
    enabled: true

  homeassistant:           # умный дом через Home Assistant
    enabled: false
    url: "http://homeassistant.local:8123"
    token: ""             # Long-lived access token

  telegram:                # отправка сообщений через Telegram
    enabled: false
    bot_token: ""          # от @BotFather
    chat_id: ""            # ID чата

  alarm:                   # будильники
    enabled: true
    snooze_min: 5

  passwords:               # менеджер паролей (отключён по умолчанию)
    enabled: false
    # vault_file: "~/.jarvis/vault.json"

  notes:                   # заметки с тегами
    enabled: true

  agenda:                  # ежедневник (календарь + заметки + таймеры)
    enabled: true

  habits:                  # трекер привычек
    enabled: true

  expenses:                # трекер расходов
    enabled: true

  network:                 # сетевые утилиты (ping, speedtest, порты, IP, DNS)
    enabled: true

  windows:                 # менеджер окон (split screen, мониторы)
    enabled: true

  disk:                    # анализ диска (статистика, топ тяжёлых папок)
    enabled: true

  sysupdate:               # обновление системы (apt / pip)
    enabled: true

  processes:               # процесс-менеджер (топ CPU/RAM, kill)
    enabled: true

  music_recognition:       # распознавание музыки (AudD API)
    enabled: false
    api_key: ""          # audd.io API token
    record_seconds: 5

  qr:                      # генерация QR-кодов
    enabled: true

  image_gen:               # генерация изображений
    enabled: false
    backend: auto          # auto | openai | stable_diffusion
    api_key: ""
    api_base: ""
    sd_url: "http://127.0.0.1:7860"
    size: "1024x1024"

  radio:                   # интернет-радио
    enabled: true

  aliases:                 # голосовые сокращения -> полная команда для LLM
    тихо: "установи громкость на 20 процентов"
    громко: "установи громкость на 80 процентов"
    музыка: "открой приложение Spotify"
    погода: "какая сейчас погода"
    расписание: "покажи события на сегодня"

# Алиасы верхнего уровня (альтернатива skills.aliases)
# aliases:
#   стоп: "остановить музыку"  
