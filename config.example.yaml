# ╔══════════════════════════════════════════════════════════════════╗
# ║  J.A.R.V.I.S. — Конфигурация                                   ║
# ║  Скопируйте:  cp config.example.yaml config.yaml                 ║
# ║  Или:         python -m jarvis config init                        ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Подсказки:
#   Путь с ~ автоматически раскрывается (/home/you/...)
#   ${ENV_VAR} — подстановка из переменных окружения
#   Все значения ниже — дефолтные, можете удалить то, что не меняете

log_level: INFO
hotkey: ctrl+alt+j                      # горячая клавиша вызова
greeting: "Все системы в норме, сэр."

# ─── Голос и речь ─────────────────────────────────────────────────

# brain.profile — выбирает личность и голос: jarvis | friday | military |
#   friendly | pirate | concise | butler | hacker
# Можно переключать голосом: "Джарвис, включи профиль пятница"

wake_word:
  enabled: true
  model: hey_jarvis                      # модель openWakeWord
  threshold: 0.5                         # 0.0–1.0, ниже = чувствительнее
  fallback_phrases: ["джарвис", "jarvis"]

stt:                                      # распознавание (faster-whisper)
  model: small                           # tiny | base | small | medium | large-v3
  language: ru
  device: auto                           # auto | cpu | cuda
  compute_type: int8                     # int8 (CPU) | float16 (GPU)

#tts:                                    # синтез речи (раскомментируйте чтобы менять)
#  engine: edge                          # sapi5 (офлайн Windows) | edge (neural, нужен интернет)
#  edge_voice: ru-RU-DmitryNeural
#  rate: 190
#  volume: 1.0

#mic:                                    # микрофон (раскомментируйте чтобы менять)
#  device: null                          # индекс из `python -m jarvis devices`
#  silence_ms: 800                       # пауза = конец фразы
#  max_utterance_s: 15.0

# ─── Мозг (LLM) ──────────────────────────────────────────────────

brain:
  backend: ollama                        # ollama | openai | offline
  # --- Ollama (локально, бесплатно) ---
  ollama_model: qwen2.5:7b-instruct
  ollama_host: http://127.0.0.1:11434
  # --- OpenAI / совместимые API ---
  # OPENAI_API_KEY задайте в переменных окружения!
  # openai_model: gpt-4o-mini
  # openai_base_url: ""                 # для OpenRouter: https://openrouter.ai/api/v1
  # --- Общие ---
  temperature: 0.4                       # 0.0–2.0, ниже = точнее
  max_history: 20                        # контекст в сообщениях
  max_tool_iterations: 5                 # максимум вызовов навыков за ответ

# ─── Интерфейс и мониторинг ──────────────────────────────────────

ui:
  enabled: true
  opacity: 0.85
  accent: "#3fd0ff"
  corner: bottom-right                   # top-left | top-right | bottom-left | bottom-right

#monitor:                                # Джарвис сам предупреждает о проблемах
#  enabled: true
#  battery_low: 20
#  memory_high: 90
#  cpu_high: 95

# ─── Навыки ─────────────────────────────────────────────────────
